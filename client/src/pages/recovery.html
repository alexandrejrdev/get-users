<!DOCTYPE html>
<html lang="PT.br">
<head>

    <link rel="stylesheet" href="/Alex01/get-users/client/src/styles/recovery.css">
    <title>Recuperar</title>
</head>

<body>
    <main>
        <form>
            <h1>Recuperar</h1>
            <div class="email">
                <label>Email *</label>
                <input type="email">
            </div>
            <div class="senha">
                <label>Nova Senha *</label>
                <input type="password" id="new-password">
            </div>
            <div class="confirmsenha">
                <label>Confirmar Nova Senha *</label>
                <input type="password" id="confirm-new-password">
            </div>
            <div class="mostrarsenha">
                <input type="checkbox">
                <label id="Label-passowrd">Mostrar Senha</label>
            </div>
            <button>Recuperar</button>
            <div class="links">
                <p>Não possui cadastro? Registre-se <a href="register.html">aqui</a>.</p>
            </div>
        </form>
    </main>
    <script src="../scripts/recovery.js"></script>
</body>

</html>
